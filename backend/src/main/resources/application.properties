spring.application.name=bookrecord

# Datasource (SQLite)
spring.datasource.url=jdbc:sqlite:${DB_PATH:./data/bookrecord.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32bytes-min}
app.jwt.expiration-minutes=60

# openBD (ISBN検索)
app.openbd.base-url=${OPENBD_BASE_URL:https://api.openbd.jp/v1}

# 国立国会図書館サーチ (タイトル検索)
app.ndl.base-url=${NDL_BASE_URL:https://ndlsearch.ndl.go.jp}
