<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>洋服管理アプリ 画面モック v0.2</title>
<style>
  :root {
    --bg: #f2f2f7;
    --card: #ffffff;
    --text: #1c1c1e;
    --sub: #8e8e93;
    --line: #e5e5ea;
    --accent: #2b5f8e;
    --accent-weak: #e6eef6;
    --danger: #d93a2b;
    --radius: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", sans-serif;
    background: #d9dce1;
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 40px;
    padding: 32px;
    min-height: 100vh;
  }
  button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; }
  input, select, textarea { font: inherit; color: inherit; }

  /* ---------- 説明パネル（PC表示のみ） ---------- */
  .panel {
    width: 340px; background: #fff; border-radius: 16px; padding: 20px 22px;
    box-shadow: 0 4px 20px rgba(0,0,0,.08); position: sticky; top: 32px;
    max-height: calc(100vh - 64px); overflow-y: auto; font-size: 14px;
  }
  .panel h1 { font-size: 17px; margin: 0 0 4px; }
  .panel .ver { color: var(--sub); font-size: 12px; margin-bottom: 16px; }
  .panel h2 { font-size: 12px; color: var(--sub); margin: 18px 0 8px; letter-spacing: .05em; }
  .panel .current { background: var(--accent-weak); border-radius: 10px; padding: 12px 14px; }
  .panel .current .id { font-weight: 700; color: var(--accent); }
  .panel .current p { margin: 6px 0 0; line-height: 1.6; }
  .panel ul { list-style: none; padding: 0; margin: 0; }
  .panel li button { display: block; width: 100%; text-align: left; padding: 7px 10px; border-radius: 8px; }
  .panel li button:hover { background: var(--bg); }
  .panel li button.on { background: var(--accent); color: #fff; }
  .panel label { display: flex; gap: 8px; align-items: center; padding: 5px 0; cursor: pointer; }
  .panel .reset { margin-top: 12px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; width: 100%; }

  /* ---------- iPhoneフレーム ---------- */
  .phone {
    width: 390px; height: 844px; border-radius: 52px; background: var(--bg);
    box-shadow: 0 0 0 12px #111, 0 20px 50px rgba(0,0,0,.35);
    position: relative; overflow: hidden; flex-shrink: 0;
  }
  .statusbar {
    height: 50px; display: flex; justify-content: space-between; align-items: center;
    padding: 6px 34px 0; font-weight: 600; font-size: 15px; position: relative; z-index: 5;
  }
  .statusbar .notch { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); width: 120px; height: 34px; background: #111; border-radius: 20px; }
  .app { position: absolute; top: 50px; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; }

  @media (max-width: 760px) {
    body { padding: 0; background: var(--bg); }
    .panel { display: none; }
    .phone { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }
    .statusbar { display: none; }
    .app { top: env(safe-area-inset-top); }
  }

  /* ---------- 共通 ---------- */
  .navbar { height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 8px; flex-shrink: 0; position: relative; }
  .navbar .title { position: absolute; left: 50%; transform: translateX(-50%); font-weight: 600; font-size: 17px; white-space: nowrap; }
  .navbar .nav-btn { color: var(--accent); font-size: 17px; display: flex; align-items: center; gap: 2px; padding: 8px; min-width: 44px; }
  .navbar .nav-btn.bold { font-weight: 600; }
  .navbar .nav-btn:disabled { color: var(--sub); }
  .content { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
  .large-title { display: flex; align-items: baseline; justify-content: space-between; padding: 0 16px 8px; }
  .large-title h1 { font-size: 32px; margin: 0; letter-spacing: .01em; }
  .large-title .count { color: var(--sub); font-size: 14px; }
  .icon-btn { width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; color: var(--accent); position: relative; border-radius: 50%; }
  .icon-btn .badge { position: absolute; top: 4px; right: 2px; background: var(--danger); color: #fff; font-size: 11px; min-width: 17px; height: 17px; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 4px; font-weight: 600; }
  .section-title { font-size: 13px; color: var(--sub); padding: 18px 20px 6px; }
  .group { background: var(--card); border-radius: var(--radius); margin: 0 16px; overflow: hidden; }
  .row { display: flex; align-items: center; min-height: 44px; padding: 10px 16px; gap: 12px; border-bottom: 1px solid var(--line); font-size: 16px; }
  .row:last-child { border-bottom: none; }
  .row .label { color: var(--sub); width: 88px; flex-shrink: 0; font-size: 15px; }
  .row .value { flex: 1; text-align: right; word-break: break-all; }
  .row.link { width: 100%; text-align: left; }
  .row.link .value { color: var(--sub); }
  .chev { color: #c4c4c7; display: flex; }
  .toast {
    position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); background: rgba(28,28,30,.92);
    color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 14px; z-index: 60; white-space: nowrap;
    animation: fade 2.2s forwards;
  }
  @keyframes fade { 0% { opacity: 0; } 10% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }

  /* ---------- タブバー ---------- */
  .tabbar { height: 82px; flex-shrink: 0; background: rgba(249,249,249,.96); border-top: 1px solid var(--line); display: flex; padding-bottom: 26px; }
  .tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; color: var(--sub); }
  .tabbar button.on { color: var(--accent); }

  /* ---------- 一覧 ---------- */
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex-shrink: 0; padding: 7px 14px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); font-size: 14px; white-space: nowrap; }
  .chip .n { color: var(--sub); font-size: 12px; margin-left: 4px; }
  .chip.on { background: var(--text); color: #fff; border-color: var(--text); }
  .chip.on .n { color: #c7c7cc; }
  .chip.small { padding: 5px 12px; font-size: 13px; }
  .chip.small.on { background: var(--accent); border-color: var(--accent); }
  .chip.zero { color: #b0b0b5; }
  .active-filters { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 8px; align-items: center; }
  .tag-x { display: inline-flex; align-items: center; gap: 4px; background: var(--accent-weak); color: var(--accent); border-radius: 14px; padding: 4px 8px 4px 10px; font-size: 13px; }
  .clear-all { color: var(--accent); font-size: 13px; padding: 4px 6px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 6px; padding: 4px 12px 120px; }
  .card { text-align: left; min-width: 0; }
  .card .thumb { aspect-ratio: 1 / 1; border-radius: 10px; overflow: hidden; position: relative; }
  .card .thumb .cnt { position: absolute; right: 5px; bottom: 5px; background: rgba(0,0,0,.55); color: #fff; font-size: 10px; border-radius: 8px; padding: 1px 6px; }
  .card .name { font-size: 12px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .meta { font-size: 11px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fab {
    position: absolute; right: 20px; bottom: 100px; width: 58px; height: 58px; border-radius: 50%;
    background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 16px rgba(43,95,142,.45); z-index: 10;
  }
  .empty { text-align: center; color: var(--sub); padding: 80px 32px; line-height: 1.7; }
  .empty .big { font-size: 56px; margin-bottom: 8px; }
  .empty .btn { margin-top: 16px; }
  .banner { margin: 0 16px 10px; background: #fff7e0; border: 1px solid #f1d98a; border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.6; display: flex; gap: 8px; align-items: flex-start; }
  .banner b { display: block; }
  .banner button { color: var(--sub); margin-left: auto; }

  /* ---------- 写真プレースホルダ ---------- */
  .ph { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
  .ph .emoji { font-size: 44px; filter: drop-shadow(0 2px 3px rgba(0,0,0,.2)); }
  .ph .lbl { position: absolute; left: 6px; top: 5px; font-size: 10px; background: rgba(255,255,255,.75); color: #333; border-radius: 6px; padding: 1px 5px; }
  .ph.light { box-shadow: inset 0 0 0 1px var(--line); }

  /* ---------- 詳細 ---------- */
  .carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
  .carousel::-webkit-scrollbar { display: none; }
  .carousel .slide { flex: 0 0 100%; aspect-ratio: 1 / 1; scroll-snap-align: start; }
  .carousel .slide .emoji { font-size: 120px; }
  .carousel .slide .lbl { font-size: 13px; left: 12px; top: 12px; padding: 2px 8px; }
  .carousel-wrap { position: relative; }
  .pager { position: absolute; right: 12px; bottom: 12px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; padding: 2px 10px; border-radius: 10px; }
  .dots { display: flex; justify-content: center; gap: 6px; padding: 10px 0 0; }
  .dots span { width: 7px; height: 7px; border-radius: 50%; background: #c7c7cc; }
  .dots span.on { background: var(--text); }
  .detail-head { padding: 14px 20px 4px; }
  .detail-head h2 { margin: 0 0 6px; font-size: 22px; }
  .detail-head .path { color: var(--sub); font-size: 14px; }
  .detail-tags { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 20px 0; }
  .pill { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 10px; font-size: 13px; }
  .swatch { width: 14px; height: 14px; border-radius: 50%; display: inline-block; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); flex-shrink: 0; }
  .memo { white-space: pre-wrap; line-height: 1.6; padding: 12px 16px; font-size: 15px; }
  .danger-btn { display: block; width: calc(100% - 32px); margin: 24px 16px 0; background: var(--card); color: var(--danger); border-radius: var(--radius); height: 48px; font-size: 16px; }
  .stamp { text-align: center; color: var(--sub); font-size: 12px; padding: 12px 0 40px; }

  /* ---------- フォーム ---------- */
  .form .row { align-items: center; }
  .form .row .label { width: 96px; color: var(--text); }
  .form .req { color: var(--danger); font-size: 11px; margin-left: 2px; }
  .form input[type=text], .form input[type=date], .form select, .form textarea {
    flex: 1; border: none; outline: none; background: transparent; font-size: 16px; text-align: right; min-width: 0; padding: 2px 0;
  }
  .form select { text-align-last: right; appearance: none; -webkit-appearance: none; color: var(--text); }
  .form select.placeholder { color: #c4c4c7; }
  .form input::placeholder, .form textarea::placeholder { color: #c4c4c7; }
  .form textarea { text-align: left; min-height: 90px; resize: none; }
  .form .row.col { flex-direction: column; align-items: stretch; gap: 10px; }
  .form .row.col .label { width: auto; }
  .yen { color: var(--sub); }
  .err { color: var(--danger); font-size: 12px; padding: 4px 20px 0; }
  .err.in { padding: 0 16px 8px; margin-top: -4px; border-bottom: 1px solid var(--line); }
  .primary-btn:disabled { opacity: .45; }
  .dialog .btns button:disabled { color: #c4c4c7; }
  .sub-note { font-size: 12px; color: var(--sub); padding: 0 16px 10px; margin-top: -4px; }
  .row.has-err .label { color: var(--danger); }
  .photo-strip { display: flex; gap: 10px; overflow-x: auto; padding: 4px 16px 4px; scrollbar-width: none; }
  .photo-strip::-webkit-scrollbar { display: none; }
  .p-item { width: 92px; height: 92px; border-radius: 10px; overflow: hidden; position: relative; flex-shrink: 0; }
  .p-item .main { position: absolute; left: 0; right: 0; bottom: 0; background: rgba(43,95,142,.92); color: #fff; font-size: 11px; text-align: center; padding: 2px 0; }
  .p-item .ph .emoji { font-size: 34px; }
  .p-add { width: 92px; height: 92px; border-radius: 10px; border: 1.5px dashed #b5b5ba; color: var(--accent); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; flex-shrink: 0; background: var(--card); }
  .p-add.err-border { border-color: var(--danger); color: var(--danger); }
  .hint { font-size: 12px; color: var(--sub); padding: 6px 20px 0; }
  .color-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px 4px; }
  .color-opt { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--sub); }
  .color-opt .swatch { width: 32px; height: 32px; }
  .color-opt.on { color: var(--text); font-weight: 600; }
  .color-opt.on .swatch { box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--accent); }
  .seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .seg button { border: 1px solid var(--line); border-radius: 8px; height: 38px; font-size: 15px; background: var(--card); }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ---------- シート・ダイアログ ---------- */
  .backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.35); z-index: 40; }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--bg); border-radius: 14px 14px 0 0; z-index: 41; max-height: 85%; display: flex; flex-direction: column; animation: up .2s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: .5; } to { transform: none; opacity: 1; } }
  .sheet .grip { width: 36px; height: 5px; border-radius: 3px; background: #c7c7cc; margin: 8px auto 0; }
  .sheet .sheet-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; }
  .sheet .sheet-head .t { font-weight: 600; font-size: 17px; }
  .sheet .sheet-body { overflow-y: auto; padding-bottom: 12px; }
  .sheet .sheet-foot { padding: 10px 16px 30px; border-top: 1px solid var(--line); background: var(--bg); }
  .primary-btn { width: 100%; height: 50px; border-radius: 12px; background: var(--accent); color: #fff; font-size: 17px; font-weight: 600; }
  .filter-sec { padding: 4px 16px 10px; }
  .filter-sec h3 { font-size: 13px; color: var(--sub); margin: 12px 4px 8px; font-weight: 500; }
  .wrap-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .actions { position: absolute; left: 8px; right: 8px; bottom: 30px; z-index: 41; animation: up .2s ease-out; }
  .actions .box { background: rgba(250,250,250,.98); border-radius: 14px; overflow: hidden; }
  .actions .box .head { text-align: center; color: var(--sub); font-size: 13px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .actions .box button { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 56px; font-size: 18px; color: var(--accent); border-bottom: 1px solid var(--line); position: relative; }
  .actions .box button:last-child { border-bottom: none; }
  .actions .box button.destructive { color: var(--danger); }
  .actions .box button .check { position: absolute; right: 18px; }
  .actions .cancel { margin-top: 8px; width: 100%; height: 56px; background: #fff; border-radius: 14px; font-size: 18px; font-weight: 600; color: var(--accent); }
  .dialog { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 280px; background: rgba(250,250,250,.98); border-radius: 14px; z-index: 51; text-align: center; overflow: hidden; }
  .dialog-bd { z-index: 50; }
  .dialog .body { padding: 20px 16px 16px; }
  .dialog .body .t { font-weight: 600; font-size: 17px; }
  .dialog .body .m { font-size: 13px; margin-top: 6px; line-height: 1.5; }
  .dialog .body input { width: 100%; margin-top: 12px; border: 1px solid #c7c7cc; border-radius: 8px; padding: 8px; font-size: 15px; background: #fff; }
  .dialog .body .e { color: var(--danger); font-size: 12px; margin-top: 6px; text-align: left; }
  .dialog .btns { display: flex; border-top: 1px solid var(--line); }
  .dialog .btns button { flex: 1; height: 46px; font-size: 17px; color: var(--accent); }
  .dialog .btns button + button { border-left: 1px solid var(--line); }
  .dialog .btns button.bold { font-weight: 600; }
  .dialog .btns button.destructive { color: var(--danger); }

  /* ---------- サブカテゴリ ---------- */
  .sub-row { display: flex; align-items: center; gap: 8px; min-height: 50px; padding: 6px 8px 6px 16px; border-bottom: 1px solid var(--line); }
  .sub-row:last-child { border-bottom: none; }
  .sub-row .nm { flex: 1; font-size: 16px; }
  .sub-row .n { color: var(--sub); font-size: 13px; margin-right: 4px; }
  .sub-row .ib { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: var(--accent); border-radius: 8px; }
  .sub-row .ib.del { color: var(--danger); }
  .sub-row .ib:disabled { color: #d1d1d6; }
  .add-row { display: flex; align-items: center; gap: 8px; color: var(--accent); width: 100%; padding: 14px 16px; font-size: 16px; }
</style>
</head>
<body>

<aside class="panel" id="panel"></aside>

<div class="phone">
  <div class="statusbar"><span>9:41</span><span class="notch"></span><span>100%</span></div>
  <div class="app" id="app"></div>
</div>

<script>
/* =========================================================
   マスタ定義
   ========================================================= */

];

const PHOTO_LABELS = ['正面', '背面', 'タグ', '着用', 'ディテール'];
const MAX_PHOTOS = 10;
const SORTS = [
  { id: 'created_desc', name: '登録日が新しい順' },
  { id: 'created_asc',  name: '登録日が古い順' },

function photo(colorId, catId, label) {
  const c = color(colorId) || { hex: '#d1d1d6' };
  const bg = c.hex.startsWith('conic') ? 'linear-gradient(135deg,#f6d365,#a1c4fd)' : `linear-gradient(140deg, ${c.hex}, ${shade(c.hex, -18)})`;
  const ic = (cat(catId) || { icon: '👔' }).icon;
  return `<div class="ph ${c.light ? 'light' : ''}" style="background:${bg}"><span class="emoji">${ic}</span>${label ? `<span class="lbl">${esc(label)}</span>` : ''}</div>`;
}
function shade(hex, pct) {
  const n = parseInt(hex.slice(1), 16);
  const f = v => Math.max(0, Math.min(255, Math.round(v + v * pct / 100)));
  return '#' + [f(n >> 16), f((n >> 8) & 255), f(n & 255)].map(v => v.toString(16).padStart(2, '0')).join('');
}

function go(name, params = {}) {
  if (cur().name === 'SC-01') state.listScroll = $app.querySelector('.content')?.scrollTop || 0;
  state.stack.push({ name, ...params }); state.sheet = null; render(true);
}
function back() {
  if (state.stack.length > 1) state.stack.pop();
  if (cur().name === 'SC-01') state.restoreListScroll = true;
  state.reorder = false;
  render(true);
}
function tab(name) { state.stack = [{ name }]; state.reorder = false; render(true); }
function toast(msg) { state.toast = { msg, t: Date.now() }; }

/* =========================================================
   一覧の絞り込み・並び替え
   ========================================================= */
function applyFilter(items, f, ignore = {}) {
  return items.filter(i =>
    (ignore.cat || !f.catId || i.catId === f.catId) &&
    (ignore.sub || !f.subId || (f.subId === '__none__' ? !i.subId : i.subId === f.subId)) &&
    (!f.colors.length || f.colors.includes(i.colorId)) &&
    (!f.seasons.length || f.seasons.some(s => i.seasons.includes(s))) &&
    (!f.brands.length || f.brands.includes(i.brand)));
}
function sortItems(items) {
  const a = [...items];
  const last = (v, desc, cmp) => (x, y) => {
    const vx = v(x), vy = v(y);
    if (vx == null || vx === '') return (vy == null || vy === '') ? 0 : 1;
    if (vy == null || vy === '') return -1;
    return desc ? cmp(vy, vx) : cmp(vx, vy);
  };
  const num = (p, q) => p - q, str = (p, q) => String(p).localeCompare(String(q), 'ja');
  const tie = cmp => (x, y) => cmp(x, y) || (y.createdAt - x.createdAt);
  switch (state.sort) {
    case 'created_desc': return a.sort((x, y) => y.createdAt - x.createdAt);
    case 'created_asc':  return a.sort((x, y) => x.createdAt - y.createdAt);
    case 'buy_desc':     return a.sort(tie(last(i => i.buyDate, true, str)));
    case 'buy_asc':      return a.sort(tie(last(i => i.buyDate, false, str)));
    case 'price_desc':   return a.sort(tie(last(i => i.price, true, num)));
    case 'price_asc':    return a.sort(tie(last(i => i.price, false, num)));
    case 'name_asc':     return a.sort(tie((x, y) => jaCompare(x.name, y.name)));
  }
  return a;
}
const extraFilterCount = f => f.colors.length + f.seasons.length + f.brands.length;
/* 名前順：五十音順、英字で始まるものは日本語の後 */
const jaCompare = (a, b) => { const ea = /^[\x00-\x7F]/.test(a), eb = /^[\x00-\x7F]/.test(b); return ea !== eb ? (ea ? 1 : -1) : a.localeCompare(b, 'ja'); };
const brands = () => [...new Set(state.items.map(i => i.brand).filter(Boolean))].sort(jaCompare);

}

function renderList() {
  const f = state.filter;
  const all = state.items;
  const bl = brands();
  f.brands = f.brands.filter(b => bl.includes(b));   // 該当アイテムがなくなったブランドは条件から外す
  const shown = sortItems(applyFilter(all, f));
  const filtered = f.catId || f.subId || extraFilterCount(f);
  const cnt = extraFilterCount(f);

  const catChips = [`<button class="chip ${!f.catId ? 'on' : ''}" data-action="cat" data-id="">すべて<span class="n">${applyFilter(all, f, { cat: true, sub: true }).length}</span></button>`]
    .concat(CATEGORIES.map(c => {
      const n = applyFilter(all, f, { cat: true, sub: true }).filter(i => i.catId === c.id).length;
      return `<button class="chip ${f.catId === c.id ? 'on' : ''} ${n ? '' : 'zero'}" data-action="cat" data-id="${c.id}">${c.name}<span class="n">${n}</span></button>`;
    })).join('');

  let subChips = '';
  const hasUnset = f.catId && all.some(i => i.catId === f.catId && !i.subId);
  if (f.catId && (state.subs[f.catId].length || hasUnset)) {
    const base = applyFilter(all, f, { sub: true });
    const unsetN = base.filter(i => !i.subId).length;
    subChips = `<div class="chips">
      <button class="chip small ${!f.subId ? 'on' : ''}" data-action="sub" data-id="">すべて</button>
      ${state.subs[f.catId].map(s => { const n = base.filter(i => i.subId === s.id).length;
        return `<button class="chip small ${f.subId === s.id ? 'on' : ''} ${n ? '' : 'zero'}" data-action="sub" data-id="${s.id}">${esc(s.name)}<span class="n">${n}</span></button>`; }).join('')}
      ${hasUnset ? `<button class="chip small ${f.subId === '__none__' ? 'on' : ''} ${unsetN ? '' : 'zero'}" data-action="sub" data-id="__none__">未設定<span class="n">${unsetN}</span></button>` : ''}
    </div>`;
  }

  const tags = [
    ...f.colors.map(id => `<span class="tag-x"><span class="swatch" style="${swatchStyle(color(id))}"></span>${color(id).name}<button data-action="rmf" data-k="colors" data-v="${id}">${ICON.x}</button></span>`),
    ...f.seasons.map(s => `<span class="tag-x">${s}<button data-action="rmf" data-k="seasons" data-v="${s}">${ICON.x}</button></span>`),
    ...f.brands.map(b => `<span class="tag-x">${esc(b)}<button data-action="rmf" data-k="brands" data-v="${esc(b)}">${ICON.x}</button></span>`),
  ];
  const tagRow = tags.length ? `<div class="active-filters">${tags.join('')}<button class="clear-all" data-action="clearExtra">クリア</button></div>` : '';

  const banner = state.browserMode && !state.bannerClosed ? `<div class="banner"><div>📲<b>ホーム画面に追加してご利用ください</b>Safariの共有ボタン → 「ホーム画面に追加」。追加せずに使うと、しばらく開かない間にデータが消える場合があります。</div><button data-action="closeBanner">${ICON.x}</button></div>` : '';

  let body;
  if (!all.length) {
    body = `<div class="empty"><div class="big">👕</div>まだアイテムが登録されていません。<br>右下の＋から、手持ちの服を登録しましょう。</div>`;
  } else if (!shown.length) {
    body = `<div class="empty"><div class="big">🔍</div>条件に一致するアイテムがありません。<br><button class="chip on btn" data-action="clearAll">条件をすべてクリア</button></div>`;
  } else {
    body = `<div class="grid">${shown.map(i => `
      <button class="card" data-action="open" data-id="${i.id}">
        <div class="thumb">${photo(i.colorId, i.catId)}${i.photos.length > 1 ? `<span class="cnt">${i.photos.length}枚</span>` : ''}</div>
        <div class="name">${esc(i.name)}</div>
        <div class="meta">${esc(subName(i.catId, i.subId) || cat(i.catId).name)}</div>
      </button>`).join('')}</div>`;
  }

  return `
    <div class="navbar">
      <span></span>
      <div>
        <button class="icon-btn" data-action="openSort" aria-label="並び替え">${ICON.sort}</button>
        <button class="icon-btn" data-action="openFilter" aria-label="絞り込み">${ICON.filter}${cnt ? `<span class="badge">${cnt}</span>` : ''}</button>
      </div>
    </div>
    <div class="content">
      <div class="large-title"><h1>クローゼット</h1><span class="count">${filtered ? `${shown.length} / ${all.length}点` : `${all.length}点`}</span></div>
      ${banner}
      ${all.length ? `<div class="chips">${catChips}</div>${subChips}${tagRow}` : ''}
      ${body}
    </div>
    <button class="fab" data-action="new" aria-label="アイテム登録">${ICON.plus}</button>
    ${tabbar('closet')}`;
}

let lastScreenKey = null;
function render(navigated = false) {
  const prevContent = $app.querySelector('.content');
  const key = JSON.stringify(cur());
  let scroll = (!navigated && !state.resetScroll && prevContent && key === lastScreenKey) ? prevContent.scrollTop : 0;
  if (cur().name === 'SC-01' && state.restoreListScroll) scroll = state.listScroll || 0;   // 詳細から戻ったら一覧の位置を復元
  state.resetScroll = false; state.restoreListScroll = false;
  const stripScroll = $app.querySelector('.photo-strip')?.scrollLeft || 0;

  const r = { 'SC-01': renderList, 'SC-04': renderDetail, 'SC-05': renderForm, 'SC-06': renderSettings, 'SC-07': renderCatSelect, 'SC-08': renderSubEdit }[cur().name];
  let html = r() + renderSheet() + renderDialog();
  if (state.toast && Date.now() - state.toast.t < 2200) html += `<div class="toast">${esc(state.toast.msg)}</div>`;
  $app.innerHTML = html;
  lastScreenKey = key;

  const c = $app.querySelector('.content');
  if (c) c.scrollTop = scroll;
  const strip = $app.querySelector('.photo-strip');
  if (strip && !navigated) strip.scrollLeft = stripScroll;
  if (state.scrollToError) {   // 入力エラー時は最初のエラー項目までスクロール
    state.scrollToError = false;
    const first = $app.querySelector('.has-err, .p-add.err-border');
    if (first) first.scrollIntoView({ block: 'center' });
  }

  const car = document.getElementById('carousel');
  if (car) car.addEventListener('scroll', () => {
    const k = Math.round(car.scrollLeft / car.clientWidth);
    const p = document.getElementById('pager'); if (p) p.textContent = `${k + 1} / ${car.children.length}`;
    document.querySelectorAll('#dots span').forEach((d, j) => d.classList.toggle('on', j === k));
  });
  const di = document.getElementById('dlgInput');
  if (di) { di.focus(); di.setSelectionRange(di.value.length, di.value.length); }
  renderPanel();
}

function openDialog(d) { state.dialog = d; render(); }

function validateSubName(catId, name, exceptId) {
  const v = name.trim();
  if (!v) return '名称を入力してください';
  if (v.length > 20) return '20文字以内で入力してください';
  if (state.subs[catId].some(s => s.name === v && s.id !== exceptId)) return '同じ名前のサブカテゴリが既に存在します';
  return '';
}

function saveForm() {
  const f = state.form;
  const e = {};
  if (!f.photos.length) e.photos = '写真を1枚以上登録してください';
  if (!f.name.trim()) e.name = '名前を入力してください';
  if (!f.catId) e.catId = 'カテゴリを選択してください';
  if (!f.colorId) e.colorId = 'ベースカラーを選択してください';
  if (f.price !== '' && !/^\d{1,7}$/.test(f.price)) e.price = '購入金額は0〜9,999,999の整数で入力してください';
  if (f.buyDate && f.buyDate > today()) e.buyDate = '購入日に未来の日付は指定できません';
  f.errors = e;
  if (Object.keys(e).length) { toast('入力内容を確認してください'); state.scrollToError = true; render(); return; }

  const data = {
    name: f.name.trim(), catId: f.catId, subId: f.subId, colorId: f.colorId, brand: f.brand.trim(), size: f.size.trim(),
    buyDate: f.buyDate, price: f.price === '' ? null : Number(f.price), shop: f.shop.trim(),
    seasons: SEASONS.filter(s => f.seasons.includes(s)), material: f.material.trim(), wash: f.wash.trim(), memo: f.memo, photos: f.photos,
  };
  if (f.mode === 'new') {
    state.items.push({ id: uid(), ...data, createdAt: Date.now(), updatedAt: Date.now() });
    state.form = null;
    state.stack = [{ name: 'SC-01' }];
    toast('登録しました');
  } else {
    Object.assign(item(f.id), data, { updatedAt: Date.now() });
    state.form = null;
    state.stack.pop();
    toast('保存しました');
  }
  render(true);
}

const actions = {
  tab: el => tab(el.dataset.to),
  go: el => { if (el.dataset.to === 'SC-08') state.reorder = false; go(el.dataset.to, el.dataset.cat ? { cat: el.dataset.cat } : {}); },
  back: () => back(),
  open: el => go('SC-04', { id: el.dataset.id }),
  cat: el => { const id = el.dataset.id || null; if (id === state.filter.catId) return; state.filter.catId = id; state.filter.subId = null; state.resetScroll = true; render(); },
  sub: el => { state.filter.subId = el.dataset.id || null; state.resetScroll = true; render(); },
  rmf: el => { const k = el.dataset.k; state.filter[k] = state.filter[k].filter(v => v !== el.dataset.v); state.resetScroll = true; render(); },
  clearExtra: () => { Object.assign(state.filter, { colors: [], seasons: [], brands: [] }); state.resetScroll = true; render(); },
  clearAll: () => { state.filter = emptyFilter(); state.resetScroll = true; render(); },
  closeBanner: () => { state.bannerClosed = true; render(); },

  openFilter: () => { state.tmpFilter = JSON.parse(JSON.stringify(state.filter)); state.sheet = { type: 'filter', screen: 'SC-02' }; render(); },
  tmpToggle: el => { const a = state.tmpFilter[el.dataset.k], v = el.dataset.v; const i = a.indexOf(v); i >= 0 ? a.splice(i, 1) : a.push(v); render(); },
  resetTmp: () => { Object.assign(state.tmpFilter, { colors: [], seasons: [], brands: [] }); render(); },
  applyFilter: () => { state.filter = state.tmpFilter; state.sheet = null; state.resetScroll = true; render(); },
  openSort: () => {
    state.sheet = { type: 'actions', screen: 'SC-03', title: '並び替え', options: SORTS.map(s => ({ label: s.name, checked: state.sort === s.id,
      fn: () => { if (state.sort !== s.id) { state.sort = s.id; state.resetScroll = true; } } })) };
    render();
  },
  closeSheet: () => { state.sheet = null; render(); },
  sheetOpt: el => { const o = state.sheet.options[+el.dataset.k]; state.sheet = null; o.fn(); render(); },

  new: () => { state.form = blankForm(); go('SC-05'); },
  edit: el => { state.form = formFromItem(item(el.dataset.id)); go('SC-05'); },
  cancelForm: () => {
    const leave = () => { state.form = null; state.dialog = null; back(); };
    if (!isDirty(state.form)) return leave();
    openDialog({ title: state.form.mode === 'new' ? '登録を中止しますか？' : '変更を破棄しますか？', message: '入力した内容は保存されません。',
      buttons: [{ label: '入力を続ける', style: 'bold', fn: closeDialog }, { label: '破棄', style: 'destructive', fn: leave }] });
  },
  save: () => saveForm(),
  addPhoto: () => {
    const f = state.form, rest = MAX_PHOTOS - f.photos.length;
    const add = (src, n) => () => {
      const k = Math.min(n, MAX_PHOTOS - f.photos.length);
      for (let j = 0; j < k; j++) f.photos.push({ id: uid(), label: src + (f.photos.length + 1) });
      delete f.errors.photos;
      if (k < n) toast(`写真は最大10枚までです。先頭から${k}枚を追加しました`);
    };
    state.sheet = { type: 'actions', screen: 'SC-05', title: `写真を追加（あと${rest}枚）`,
      options: [{ label: '写真を撮る', fn: add('撮影', 1) }, { label: 'フォトライブラリから選択', fn: add('ライブラリ', 3) }] };
    render();
  },
  photoMenu: el => {
    const k = +el.dataset.k, f = state.form;
    const opts = [];
    if (k > 0) opts.push({ label: '代表写真にする', fn: () => { const [p] = f.photos.splice(k, 1); f.photos.unshift(p); f.dirty = true; } });
    opts.push({ label: '削除', style: 'destructive', fn: () => {
      if (f.mode === 'edit' && f.photos.length === 1) { toast('写真は1枚以上必要です'); return; }
      f.photos.splice(k, 1); f.dirty = true; } });
    state.sheet = { type: 'actions', screen: 'SC-05', title: k === 0 ? '代表写真' : `写真 ${k + 1}枚目`, options: opts };
    render();
  },
  pickColor: el => { state.form.colorId = el.dataset.id; state.form.dirty = true; delete state.form.errors.colorId; render(); },
  toggleSeason: el => { const a = state.form.seasons, s = el.dataset.s; const i = a.indexOf(s); i >= 0 ? a.splice(i, 1) : a.push(s); state.form.dirty = true; render(); },

  askDelete: el => {
    const i = item(el.dataset.id);
    openDialog({ title: 'このアイテムを削除しますか？', message: `「${i.name}」を削除します。削除すると元に戻せません。`,
      buttons: [{ label: 'キャンセル', fn: closeDialog }, { label: '削除', style: 'destructive bold', fn: () => {
        state.items = state.items.filter(x => x.id !== i.id); state.dialog = null; state.stack = [{ name: 'SC-01' }]; toast('削除しました'); render(true); } }] });
  },

  toggleReorder: () => { state.reorder = !state.reorder; render(); },
  move: el => { const a = state.subs[cur().cat], k = +el.dataset.k, d = +el.dataset.d; [a[k], a[k + d]] = [a[k + d], a[k]]; render(); },
  addSub: () => {
    const catId = cur().cat;
    if (state.subs[catId].length >= 30) { toast('サブカテゴリは1つのカテゴリにつき30件まで登録できます'); render(); return; }
    openDialog({ title: 'サブカテゴリを追加', message: `「${cat(catId).name}」に追加します`, input: '', placeholder: '例: ジョガーパンツ',
      buttons: [{ label: 'キャンセル', fn: closeDialog }, { label: '追加', style: 'bold', primary: true, fn: () => {
        const err = validateSubName(catId, state.dialog.input);
        if (err) { state.dialog.error = err; render(); return; }
        state.subs[catId].push({ id: uid(), name: state.dialog.input.trim() }); state.dialog = null; toast('追加しました'); render(); } }] });
  },
  renameSub: el => {
    const catId = cur().cat, s = state.subs[catId].find(x => x.id === el.dataset.id);
    openDialog({ title: '名称を変更', message: '登録済みアイテムの表示も変更されます', input: s.name,
      buttons: [{ label: 'キャンセル', fn: closeDialog }, { label: '変更', style: 'bold', primary: true, fn: () => {
        if (state.dialog.input.trim() === s.name) return closeDialog();   // 名称が変わっていなければ何もしない
        const err = validateSubName(catId, state.dialog.input, s.id);
        if (err) { state.dialog.error = err; render(); return; }
        s.name = state.dialog.input.trim(); state.dialog = null; toast('名称を変更しました'); render(); } }] });
  },
  deleteSub: el => {
    const catId = cur().cat, s = state.subs[catId].find(x => x.id === el.dataset.id);
    const n = state.items.filter(i => i.subId === s.id).length;
    if (n) return openDialog({ title: '削除できません', message: `「${s.name}」には${n}点のアイテムが登録されています。アイテムのサブカテゴリを変更してから削除してください。`, buttons: [{ label: 'OK', style: 'bold', fn: closeDialog }] });
    openDialog({ title: `「${s.name}」を削除しますか？`, buttons: [{ label: 'キャンセル', fn: closeDialog }, { label: '削除', style: 'destructive bold', fn: () => {
      state.subs[catId] = state.subs[catId].filter(x => x.id !== s.id);
      if (state.filter.subId === s.id) state.filter.subId = null;   // 一覧で選択中だった場合は「すべて」に戻す
      state.dialog = null; toast('削除しました'); render(); } }] });
  },
  dialogBtn: el => state.dialog.buttons[+el.dataset.k].fn(),
};

$app.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el || !$app.contains(el) || el.disabled) return;
  actions[el.dataset.action]?.(el);
});
$app.addEventListener('input', e => {
  const t = e.target;
  if (t.hasAttribute('data-dialog-input')) {
    state.dialog.input = t.value;
    const pb = $app.querySelector('.dialog [data-primary]'); if (pb) pb.disabled = !t.value.trim();   // 空の間は確定不可
    if (state.dialog.error) { state.dialog.error = ''; $app.querySelector('.dialog .e')?.remove(); }
    return;
  }
  if (t.dataset.field && t.tagName !== 'SELECT' && state.form) {
    const k = t.dataset.field;
    if (k === 'price') {   // 全角数字は半角に変換し、数字以外は入力させない
      const v = t.value.replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0)).replace(/[^0-9]/g, '').slice(0, 7);
      if (v !== t.value) t.value = v;
    }
    state.form[k] = t.value;
    if (state.form.errors[k]) {   // 修正した時点でエラー表示を消す
      delete state.form.errors[k];
      const row = t.closest('.row'); row.classList.remove('has-err');
      if (row.nextElementSibling?.classList.contains('in')) row.nextElementSibling.remove();
    }
  }
});
$app.addEventListener('change', e => {
  const t = e.target;
  if (t.tagName === 'SELECT' && state.form) {
    state.form[t.dataset.field] = t.value; state.form.dirty = true;
    if (t.dataset.field === 'catId') { state.form.subId = ''; delete state.form.errors.catId; }
    render();
  }
});
$app.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.hasAttribute('data-dialog-input') && state.dialog.input.trim()) { const b = state.dialog.buttons; b[b.length - 1].fn(); }
});

/* ---------- 説明パネル ---------- */
$panel.addEventListener('click', e => {
  const b = e.target.closest('[data-panel]');
  if (!b) return;
  const k = b.dataset.panel;
  state.sheet = null; state.dialog = null;
  if (k === 'reset') { resetState(); render(true); return; }
  const firstItem = state.items[0];
  switch (k) {
    case 'SC-01': state.stack = [{ name: 'SC-01' }]; break;
    case 'SC-02': state.stack = [{ name: 'SC-01' }]; render(true); actions.openFilter(); return;
    case 'SC-03': state.stack = [{ name: 'SC-01' }]; render(true); actions.openSort(); return;
    case 'SC-04': if (!firstItem) { toast('アイテムが0件です'); break; } state.stack = [{ name: 'SC-01' }, { name: 'SC-04', id: firstItem.id }]; break;
    case 'SC-05': state.form = blankForm(); state.stack = [{ name: 'SC-01' }, { name: 'SC-05' }]; break;
    case 'SC-06': state.stack = [{ name: 'SC-06' }]; break;
    case 'SC-07': state.stack = [{ name: 'SC-06' }, { name: 'SC-07' }]; break;
    case 'SC-08': state.reorder = false; state.stack = [{ name: 'SC-06' }, { name: 'SC-07' }, { name: 'SC-08', cat: 'bottoms' }]; break;
  }
  render(true);
});
$panel.addEventListener('change', e => {
  const t = e.target.dataset.toggle;
  if (t === 'empty') {
    state.emptyMode = e.target.checked;
    if (state.emptyMode) { state.backupItems = state.items; state.items = []; }
    else { state.items = state.backupItems || sampleItems(state.subs); state.backupItems = null; }
    state.filter = emptyFilter(); state.stack = [{ name: 'SC-01' }];
  }
  if (t === 'browser') { state.browserMode = e.target.checked; state.bannerClosed = false; }
  render(true);
});

render(true);
</script>
</body>
</html>
